name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sporty
          POSTGRES_USER: sporty
          POSTGRES_PASSWORD: sporty
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sporty -d sporty"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://sporty:sporty@127.0.0.1:5432/sporty
        run: pytest --cov=app --cov-report=term-missing

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://sporty:sporty@127.0.0.1:5432/sporty
        run: alembic upgrade head
