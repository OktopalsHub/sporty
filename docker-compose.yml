services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sporty
      POSTGRES_USER: sporty
      POSTGRES_PASSWORD: sporty
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporty -d sporty"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sporty_postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://sporty:sporty@db:5432/sporty
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      DATABASE_POOL_TIMEOUT: 30
      API_KEY: 
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:5173
      SPORTYBET_BASE_URL: https://www.sportybet.com
      SPORTYBET_REGION: ng
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

volumes:
  sporty_postgres:
